# Railway Configuration برای Casino Meowi Cop Bot
# این فایل دیتابیس را در یک persistent volume ذخیره میکند

services:
  bot:
    image: python:3.11-slim
    
    # دستوری برای اجرای ربات
    command: |
      sh -c "pip install pyTelegramBotAPI && python casinomeowicop_fixed.py"
    
    # متغیرهای محیط (Environment Variables)
    environment:
      - BOT_TOKEN=${{secrets.BOT_TOKEN}}
      - DB_PATH=/data/casino_meowi.db
    
    # Volume برای persist کردن دیتابیس
    volumes:
      - data:/data
    
    # Build context (اگر کد را locally test میکنید)
    build:
      context: .
      dockerfile: Dockerfile
    
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  # این volume دیتابیس را persist میکند
  data:
    driver: local
